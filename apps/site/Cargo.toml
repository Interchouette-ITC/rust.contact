[package]
name = "rust-contact-site"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["hydrate"]
hydrate = ["leptos/hydrate", "dep:js-sys", "dep:web-sys"]
ssr = ["leptos/ssr", "dep:serenade-view"]

[[bin]]
name = "rust-contact-site"
path = "src/main.rs"
required-features = ["hydrate"]

[[bin]]
name = "prerender"
path = "src/bin/prerender.rs"
required-features = ["ssr"]

[dependencies]
leptos = { workspace = true }
js-sys = { version = "0.3", optional = true }
rangular = { workspace = true }
web-sys = { version = "0.3", optional = true, features = [
  "Window",
  "Location",
] }
serenade-view = { version = "1.0", optional = true, features = ["leptos-ssr"] }
anyhow = "1"

[build-dependencies]
rangular-build = "1.1"
