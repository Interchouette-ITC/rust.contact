[package]
name = "rust-contact-site"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["hydrate"]
hydrate = ["leptos/hydrate", "dep:js-sys", "dep:web-sys"]
ssr = ["leptos/ssr", "dep:hydration_context", "dep:serenade-minify"]

[[bin]]
name = "rust-contact-site"
path = "src/main.rs"
required-features = ["hydrate"]

[[bin]]
name = "prerender"
path = "src/bin/prerender.rs"
required-features = ["ssr"]

[dependencies]
leptos = { workspace = true }
js-sys = { version = "0.3", optional = true }
rangular-aot = { workspace = true }
rangular-host = { workspace = true }
serenade-minify = { git = "https://github.com/Interchouette-ITC/Serenade", rev = "9458f4caf7cb2e1fdea729ac2a70e81f144c5c79", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Location"] }
hydration_context = { version = "0.3.2", optional = true, default-features = false }
anyhow = "1"

[build-dependencies]
rangular-aot = { workspace = true }
rangular-css = { git = "https://github.com/Interchouette-ITC/rangular", rev = "3985abc8bfdb414c7882b9ca3966f94fd8ca3e16" }
