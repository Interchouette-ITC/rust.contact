<header class="site-header">
  <a class="brand" [attr.href]="homeUrl" aria-label="Rust.Contact home">
    <span class="brand__mark" aria-hidden="true"><span class="brand__crab">{{ brandCrab }}</span></span>
    <span class="brand__name">{{ siteName }}</span>
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    <a [attr.href]="homeUrl">Projects</a>
    <a [attr.href]="serenadeUrl">Serenade</a>
    <a [attr.href]="rustashopUrl">rustashop</a>
    <a [attr.href]="rangularUrl">rangular</a>
    <a [attr.href]="openTradingUrl">OpenTrading</a>
    <a [attr.href]="interfireUrl">InterFire</a>
    <a [attr.href]="itcyUrl">ITCy</a>
  </nav>
  <div class="header-actions">
    <a class="header-github-icon" href="https://github.com/Interchouette-ITC" aria-label="Interchouette on GitHub">
      <img src="/logo3.png" alt="Interchouette" />
    </a>
    <a class="header-cta" href="https://github.com/Interchouette-ITC">
      ITC on GitHub
    </a>
  </div>
</header>
